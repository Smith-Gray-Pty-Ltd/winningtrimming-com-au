# =============================================================================
# Winning Trimming — production stack (Hostinger VPS / Docker Compose + Traefik)
# =============================================================================
# Deploy with:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The `--env-file .env.production` flag makes Compose interpolation (${VAR})
# read from .env.production instead of the default .env file. This is critical
# — without it, ${POSTGRES_PASSWORD} resolves to empty on the VPS.
#
# Traefik (running on the host network) discovers containers via Docker labels.
# The `web` service joins the `winningtrimming-net` bridge network so it can
# talk to `db`; Traefik sees it because providers.docker=true on the host.
# =============================================================================

name: winningtrimming

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: ${POSTGRES_DB:-winningtrimming}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-winningtrimming}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - winningtrimming-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Postgres must be reached via the compose service name, not localhost.
      # POSTGRES_URI in .env.production points at localhost; override to use `db`.
      POSTGRES_URI: postgresql://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@db:5432/${POSTGRES_DB:-winningtrimming}
      NODE_ENV: production
    # ── SECURITY HARDENING (2026-09-17) ──────────────────────────────────
    # Drop ALL Linux capabilities except those needed by the entrypoint
    # (CHOWN to fix volume ownership, SETUID/SETGID for gosu to drop to nextjs).
    # The app process itself runs as nextjs with no capabilities.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # Prevent privilege escalation. Note: gosu uses setuid() which requires
    # SETUID cap, but no-new-privileges blocks it. We keep no-new-privileges
    # OFF because the entrypoint needs to drop from root to nextjs via gosu.
    # The app process (nextjs) has no capabilities anyway (cap_drop: ALL).
    # security_opt:
    #   - no-new-privileges:true
    # Read-only root filesystem prevents malware from persisting to disk.
    # Volumes and tmpfs mounts are still writable.
    read_only: true
    # Memory limit to prevent runaway processes from crashing the shared VPS.
    mem_limit: 2g
    volumes:
      # Persist media uploads across container rebuilds. The Media collection
      # (src/collections/Media.ts) uses staticDir = public/media, so Payload
      # serves files from /app/public/media at runtime. Mounting the volume
      # here means the 3900+ seed/upload images survive `docker compose down`
      # and image rebuilds — without this, every rebuild loses all media.
      - storage:/app/public/media
      # Next.js ISR/image cache — use tmpfs instead of a named volume because
      # the old volume was created by root and the nextjs user can't write to it.
      # Cache regenerates on first request; no persistence needed across restarts.
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          size: 536870912  # 512MB limit
      # Writable tmp for Node.js/Next.js internals (read-only fs needs this).
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 268435456  # 256MB limit
    networks:
      - winningtrimming-net
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect is handled globally by Traefik entrypoint config.
      # Strip X-Powered-By/Server headers so attackers can't fingerprint the stack.
      - "traefik.http.middlewares.wt-strip-headers.headers.customResponseHeaders.X-Powered-By="
      - "traefik.http.middlewares.wt-strip-headers.headers.customResponseHeaders.Server="
      # Main router (winningtrimming.com.au)
      - "traefik.http.routers.winningtrimming.rule=Host(`winningtrimming.com.au`)"
      - "traefik.http.routers.winningtrimming.entrypoints=websecure"
      - "traefik.http.routers.winningtrimming.tls=true"
      - "traefik.http.routers.winningtrimming.tls.certresolver=letsencrypt"
      - "traefik.http.routers.winningtrimming.middlewares=wt-strip-headers"
      - "traefik.http.services.winningtrimming.loadbalancer.server.port=3000"
      # WWW → apex redirect
      - "traefik.http.routers.winningtrimming-www.rule=Host(`www.winningtrimming.com.au`)"
      - "traefik.http.routers.winningtrimming-www.entrypoints=websecure"
      - "traefik.http.routers.winningtrimming-www.tls=true"
      - "traefik.http.routers.winningtrimming-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.winningtrimming-www.middlewares=www-to-apex"
      - "traefik.http.middlewares.www-to-apex.redirectregex.regex=https://www.winningtrimming.com.au/(.*)"
      - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://winningtrimming.com.au/$${1}"
      - "traefik.http.middlewares.www-to-apex.redirectregex.permanent=true"

volumes:
  db_data:
  storage:

networks:
  winningtrimming-net:
    driver: bridge